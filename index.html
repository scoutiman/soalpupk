<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Pramuka</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #5d4037; }
        .input-group { margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .question-card { margin-bottom: 20px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa; }
        .question-text { font-weight: 600; margin-bottom: 10px; display: block; }
        .options label { font-weight: normal; cursor: pointer; display: block; padding: 5px 0; }
        button { width: 100%; padding: 15px; background-color: #795548; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #5d4037; }
        #result { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; text-align: center; }
        .score-box { font-size: 48px; font-weight: bold; color: #2e7d32; }
        .correct { color: #2e7d32; }
        .incorrect { color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <h1>LATIHAN SOAL PUPK</h1>
    <h2>SCOUT IMAN</h2>
    
    <div class="input-group">
        <label for="studentName">Nama Lengkap Anggota:</label>
        <input type="text" id="studentName" placeholder="Masukkan nama kamu di sini...">
    </div>

    <div id="quiz-container">
        <!-- Soal akan muncul di sini secara otomatis melalui JavaScript -->
    </div>

    <button onclick="submitQuiz()">Selesai & Lihat Nilai</button>

    <div id="result">
        <h2 id="congratsText"></h2>
        <p>Nilai Anda:</p>
        <div class="score-box" id="scoreDisplay">0</div>
        <p id="detailScore"></p>
        <button onclick="location.reload()" style="background-color: #9e9e9e; margin-top: 10px;">Ulangi Kuis</button>
    </div>
</div>

<script>
    // DATA SOAL (Anda bisa menambah hingga 140 soal di sini)
    const questions = [
        { q: "Apa sebutan Pramuka di Singapura?", a: ["The Singapore Scout Association", "Singapore Girl Guides", "Persekutuan Pengakap Singapura"], c: 0 },
        { q: "Kapan Baden Powell dilahirkan?", a: ["14 Agustus 1857", "22 Februari 1857", "20 Mei 1908"], c: 1 },
        { q: "Siapa nama lengkap Bapak Pandu Sedunia?", a: ["Sir Robert Stephenson Smyth Baden Powell of Gilwell", "Robert Stephenson Smith", "Lord Robert Baden Smith"], c: 0 },
        { q: "Buku apa yang ditulis BP dan menjadi masterpiece-nya?", a: ["Rovering to Success", "Scouting for Boys", "Aids to Scouting"], c: 1 },
        { q: "Kapan Hari Pramuka diperingati setiap tahunnya?", a: ["20 Mei", "14 Agustus", "22 Februari"], c: 1 },
        { q: "Apa lambang Gerakan Pramuka?", a: ["Garuda Pancasila", "Siluet Tunas Kelapa", "Padi dan Kapas"], c: 1 },
        { q: "Berapakah rentang usia anggota Pramuka Siaga?", a: ["7 - 10 tahun", "11 - 15 tahun", "16 - 20 tahun"], c: 0 },
        { q: "Apa kepanjangan dari PRAMUKA?", a: ["Praja Muda Karana", "Pemuda Rakyat Merdeka", "Praja Muda Berkarya"], c: 0 },
        { q: "Siapa pencetus 'Sistem Among' dalam pendidikan?", a: ["KH. Agus Salim", "Ki Hajar Dewantara", "Muh. Yamin"], c: 1 },
        { q: "Saka yang bergerak dalam bidang kesehatan adalah...", a: ["Saka Kencana", "Saka Bakti Husada", "Saka Wanabakti"], c: 1 }
        // Tambahkan soal berikutnya dengan pola yang sama: { q: "Pertanyaan", a: ["Pilihan A", "Pilihan B", "Pilihan C"], c: index_jawaban_benar (0, 1, atau 2) }
    ];

    const quizContainer = document.getElementById('quiz-container');

    // Menampilkan soal ke halaman
    function displayQuiz() {
        questions.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <span class="question-text">${index + 1}. ${item.q}</span>
                <div class="options">
                    <label><input type="radio" name="q${index}" value="0"> a. ${item.a[0]}</label>
                    <label><input type="radio" name="q${index}" value="1"> b. ${item.a[1]}</label>
                    <label><input type="radio" name="q${index}" value="2"> c. ${item.a[2]}</label>
                </div>
            `;
            quizContainer.appendChild(card);
        });
    }

    // Menghitung nilai
    function submitQuiz() {
        const name = document.getElementById('studentName').value;
        if (!name) {
            alert("Silakan isi nama terlebih dahulu!");
            return;
        }

        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected && parseInt(selected.value) === item.c) {
                score++;
            }
        });

        const finalScore = Math.round((score / questions.length) * 100);
        
        // Tampilkan hasil
        document.getElementById('quiz-container').style.display = 'none';
        document.querySelector('button[onclick="submitQuiz()"]').style.display = 'none';
        document.querySelector('.input-group').style.display = 'none';
        
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.style.backgroundColor = finalScore >= 70 ? '#e8f5e9' : '#ffebee';
        
        document.getElementById('congratsText').innerText = `Halo, ${name}!`;
        document.getElementById('scoreDisplay').innerText = finalScore;
        document.getElementById('detailScore').innerText = `Anda menjawab benar ${score} dari ${questions.length} soal.`;
        
        window.scrollTo(0, 0);
    }

    displayQuiz();
</script>

</body>
</html>
